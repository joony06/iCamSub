<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; --b: #8884; }
    body { width: 290px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, "Malgun Gothic", sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: #13804f; color: #fff; margin-left: 4px; }
    .badge.local { background: #c9971f; }
    .status { padding: 8px 10px; border: 1px solid var(--b); border-radius: 8px; margin-bottom: 12px; }
    .status.err { border-color: #d55; }
    .muted { opacity: .65; font-size: 12px; }
    label.drop { display: block; padding: 14px 10px; border: 1.5px dashed var(--b); border-radius: 8px; text-align: center; cursor: pointer; margin-bottom: 12px; }
    label.drop.over { border-color: #3a7bd5; }
    input[type=file] { display: none; }
    .row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
    .row > span:first-child { width: 64px; flex: none; }
    button { padding: 4px 8px; border: 1px solid var(--b); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
    button:hover { background: #8882; }
    input[type=range] { flex: 1; }
    .val { width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
    hr { border: 0; border-top: 1px solid var(--b); margin: 12px 0; }
  </style>
</head>
<body>
  <h1 id="title"><img src="icons/icon32.png" alt="" width="20" height="20" /> iCamSub<span id="adminBadge" class="badge local" hidden>관리자</span></h1>
  <div id="status" class="status">플레이어 확인 중…</div>

  <div id="controls" hidden>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".srt,.vtt,text/plain" />
      SRT 파일 선택 또는 여기로 끌어놓기
    </label>

    <div class="row">
      <span>싱크</span>
      <button data-d="-1">-1</button><button data-d="-0.1">-0.1</button>
      <span class="val" id="offset">0.0s</span>
      <button data-d="0.1">+0.1</button><button data-d="1">+1</button>
      <button id="reset" title="싱크 초기화">↺</button>
    </div>
    <div class="muted">+는 자막을 늦게, -는 빠르게. 플레이어에서 [ / ] 키로도 조절돼요.</div>
    <hr />
  </div>

  <div class="row"><span>글자 크기</span><input type="range" id="fontSize" min="12" max="48" step="1" /><span class="val" id="fontSizeV"></span></div>
  <div class="row"><span>아래 여백</span><input type="range" id="bottom" min="0" max="40" step="1" /><span class="val" id="bottomV"></span></div>
  <div class="row"><span>배경</span><input type="range" id="bg" min="0" max="1" step="0.05" /><span class="val" id="bgV"></span></div>
  <div class="row"><span>표시</span><label><input type="checkbox" id="visible" /> 자막 보이기</label></div>

  <div id="clearRow" hidden>
    <hr />
    <div class="row" style="gap:8px">
      <button id="export" title="저장소에 올릴 암호화 파일을 내려받아요" hidden>공유용 파일 내보내기</button>
      <button id="clear">내 자막 삭제</button>
    </div>
    <div class="muted" id="exportHint"></div>
  </div>

  <script src="srt.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
